<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cali Plan">
<meta name="theme-color" content="#e5e8e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Cali Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one mobile column. App bar, week hero with the 4-week cycle, stat strip, day cards, coach notes. Settings live in a bottom sheet. */
:root{
--ground:#e5e8e4;--slab:#f8f9f7;--panel:#edf0ec;--ink:#131716;--graphite:#58615d;--seam:#d0d5d0;
--bar:#c4470b;--bar-ink:#ffffff;--bar-soft:#f8e3d6;--danger:#b8301f;
--c-push:#2f6ccc;--c-pull:#1d8a63;--c-legs:#b08815;--c-core:#7a4fc8;--c-skill:#c4437b;--c-cond:#0f8d99;
--shadow:0 1px 2px rgba(19,23,22,.06),0 10px 24px -14px rgba(19,23,22,.22);
--scrim:rgba(19,23,22,.45);
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
--body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--label:"Barlow Semi Condensed","Barlow",-apple-system,BlinkMacSystemFont,sans-serif;
--r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0f1211;--slab:#181c1a;--panel:#121614;--ink:#ebefeb;--graphite:#97a09c;--seam:#2a312e;--bar:#ff7029;--bar-ink:#1b0d04;--bar-soft:#36200f;--danger:#ff7b6b;--c-push:#6c9cf0;--c-pull:#4cc196;--c-legs:#dfb63c;--c-core:#a383ea;--c-skill:#ec77a7;--c-cond:#3ac0cc;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.8);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0f1211;--slab:#181c1a;--panel:#121614;--ink:#ebefeb;--graphite:#97a09c;--seam:#2a312e;--bar:#ff7029;--bar-ink:#1b0d04;--bar-soft:#36200f;--danger:#ff7b6b;--c-push:#6c9cf0;--c-pull:#4cc196;--c-legs:#dfb63c;--c-core:#a383ea;--c-skill:#ec77a7;--c-cond:#3ac0cc;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.8);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0 auto;max-width:560px;padding-inline:16px;padding-block:14px 48px;background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
svg{display:block}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}
.mark{width:36px;height:36px;flex:none;color:var(--ink)}
.mark .post{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.mark .rail{fill:none;stroke:var(--bar);stroke-width:3.4;stroke-linecap:round}
.mark .man{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mark circle{fill:currentColor}
h1{margin:0;font:900 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.summary{display:block;max-width:100%;margin-top:3px;padding:0;border:0;background:none;color:var(--graphite);font:500 14px/1.25 var(--label);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border:1px solid var(--seam);border-radius:50%;background:var(--slab);color:var(--ink)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:disabled{opacity:.35;cursor:default}

.sample{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-top:16px;padding:14px 16px;border-radius:var(--r);background:var(--bar-soft)}
.sample>div{flex:1 1 210px;min-width:0}
.sample b{font:700 14px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--bar)}
.sample p{margin:4px 0 0;font-size:15px}
.btn{border:0;border-radius:12px;background:var(--bar);color:var(--bar-ink);font:700 16px/1 var(--label);letter-spacing:.05em;text-transform:uppercase;padding:13px 18px}
.btn.full{width:100%;padding:16px;font-size:18px}

.week{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-top:24px}
.wk{text-align:center}
.eyebrow{font:600 13px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--graphite)}
.wk-num{margin:6px 0 6px;font:900 88px/.82 var(--display);font-variant-numeric:tabular-nums}
.wk-phase{font:700 16px/1.2 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--bar)}
.wk-sub{margin-top:2px;font-size:14px;color:var(--graphite);text-wrap:balance}

.cycle{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 0;padding:0}
.cycle li{display:grid;gap:7px;font:600 12px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);text-align:center}
.cycle .active{color:var(--ink)}
.track{display:block;height:6px;border-radius:3px;background:var(--seam);overflow:hidden}
.cycle .deload .track{background:repeating-linear-gradient(135deg,var(--seam) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--seam)}
.fill{display:block;height:100%;background:var(--bar);transform-origin:left center;transform:scaleX(0)}
.cycle .past .fill{transform:none;background:var(--graphite);opacity:.45}
.cycle .active .fill{transform:none}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px;border:1px solid var(--seam);border-radius:var(--r);background:var(--slab)}
.stat{display:grid;align-content:start;gap:5px;padding:12px 14px;min-width:0}
.stat+.stat{border-left:1px solid var(--seam)}
.lab{font:600 12px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
.val{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{margin-left:3px;font:600 14px/1 var(--label);letter-spacing:.02em;color:var(--graphite)}
.meter{display:block;height:4px;margin-top:3px;border-radius:2px;background:var(--seam);overflow:hidden}
.meter i{display:block;width:100%;height:100%;background:var(--bar);transform-origin:left center;transform:scaleX(0)}

#days{display:grid;gap:12px;margin-top:20px}
.day{background:var(--slab);border:1px solid var(--seam);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 14px 14px 16px}
.dnum{display:grid;justify-items:center;min-width:36px}
.dnum span{font:600 11px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}
.dnum b{font:900 46px/.88 var(--display)}
.dmeta h3{margin:0;font:700 19px/1.15 var(--label);letter-spacing:.01em}
.dmeta p{margin:3px 0 0;font-size:14px;color:var(--graphite)}
.check{width:46px;height:46px;display:grid;place-items:center;padding:0;border-radius:50%;border:2px solid var(--seam);background:transparent;color:var(--graphite);transition:background-color .2s,border-color .2s,color .2s}
.check svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--bar);border-color:var(--bar);color:var(--bar-ink)}
.exl{list-style:none;margin:0;padding:0;transition:opacity .2s}
.day.done .exl{opacity:.45}
.exl li{border-top:1px solid var(--seam)}
.exb{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto 16px;align-items:center;gap:12px;padding:12px 14px 12px 16px;border:0;background:none;text-align:left}
.cat{width:10px;height:10px;border-radius:50%;background:var(--c)}
.exn{font-size:16px;font-weight:500;line-height:1.25}
.exn small{display:block;margin-top:2px;font:500 13px/1.3 var(--label);letter-spacing:.03em;color:var(--graphite)}
.dose{font:600 16px/1 var(--label);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.dose b{font-weight:700;color:var(--bar)}
.dose i{margin:0 3px;font-style:normal;color:var(--graphite)}
.chev{width:16px;height:16px;fill:none;stroke:var(--graphite);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.exb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.det{overflow:hidden}
.det-in{display:grid;gap:10px;padding:2px 16px 16px 38px}
.det-in p{margin:0;max-width:60ch;font-size:15px;color:var(--graphite)}
.det-in a{justify-self:start;padding:6px 0;font:700 14px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--bar);text-decoration:none}
.fig{width:100%;max-width:320px;border:1px solid var(--seam);border-radius:12px;background-color:var(--panel);background-image:radial-gradient(var(--seam) 1px,transparent 1.3px);background-size:12px 12px}
.fig .limb{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
.fig .head{stroke:var(--ink);stroke-width:3;fill:var(--panel)}
.fig .gnd{stroke:var(--graphite);stroke-width:1.2;opacity:.6}
.fig .bar{stroke:var(--bar);stroke-width:3.6;stroke-linecap:round}

.coach{margin-top:24px;padding:16px;border:1.5px dashed var(--seam);border-radius:var(--r)}
.coach h2{margin:0 0 10px;font:700 13px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--graphite)}
.coach ul{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.coach li{position:relative;padding-left:18px;font-size:15px}
.coach li::before{content:"";position:absolute;left:1px;top:.68em;width:9px;height:2px;background:var(--bar)}

.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;max-height:92vh;max-height:92dvh;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--slab);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.grab{width:40px;height:5px;margin:0 auto 10px;border-radius:3px;background:var(--seam)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet h2{margin:0;font:900 28px/1 var(--display);text-transform:uppercase;outline:none}
form{display:grid;gap:20px}
fieldset{min-width:0;margin:0;padding:0;border:0}
legend,.flab{display:block;margin-bottom:8px;padding:0;font:600 13px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tile{display:grid;align-content:start;gap:3px;height:100%;padding:11px 12px;border:1.5px solid var(--seam);border-radius:12px;background:var(--ground);transition:border-color .15s,background-color .15s}
.tile b{font:600 16px/1.2 var(--label)}
.tile small{font-size:13px;line-height:1.3;color:var(--graphite)}
.opt input:checked+.tile{border-color:var(--bar);background:var(--bar-soft)}
.opt input:focus-visible+.tile,.opt input:focus-visible+.seg-i{outline:2px solid var(--bar);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border:1px solid var(--seam);border-radius:12px;background:var(--ground)}
.seg-i{display:block;padding:11px 2px;border-radius:9px;text-align:center;font:600 15px/1 var(--label);font-variant-numeric:tabular-nums;color:var(--graphite);transition:background-color .15s,color .15s}
.opt input:checked+.seg-i{background:var(--ink);color:var(--slab)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{position:relative}
.num input{width:100%;padding:12px 44px 12px 12px;border:1.5px solid var(--seam);border-radius:12px;background:var(--ground);color:var(--ink);font:600 17px/1.2 var(--label);font-variant-numeric:tabular-nums}
.num input:focus{outline:none;border-color:var(--bar)}
.num span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 14px/1 var(--label);color:var(--graphite);pointer-events:none}
.err{font-size:14px;color:var(--danger)}
.err:empty{display:none}
@media (max-width:370px){.tiles.three{grid-template-columns:1fr}.wk-num{font-size:74px}.val{font-size:26px}.stat{padding:12px 10px}}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important}}
</style>
</head>
<body>
<header class="top">
<div class="brand">
<svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><path class="post" d="M7 33V9M29 33V9"/><path class="rail" d="M4 9.5h28"/><path class="man" d="M13.5 10l3 5.5M22.5 10l-3 5.5M18 18.5v7.5M18 26l-2.5 6M18 26l2.5 6"/><circle cx="18" cy="16" r="2.6"/></svg>
<div><h1>Cali Plan</h1><button class="summary" id="summary" type="button" aria-label="Edit settings"></button></div>
</div>
<button class="ibtn" id="openSet" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
</header>

<section class="sample" id="sample" hidden>
<div><b>Sample plan</b><p>This is a beginner plan, 3 days a week with a pull-up bar. Set your goal and level to make it yours.</p></div>
<button class="btn" id="setupBtn" type="button">Set up</button>
</section>

<section class="week" aria-label="Week">
<button class="ibtn" id="prev" type="button" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div class="wk"><div class="eyebrow">Week</div><div class="wk-num" id="wkNum">1</div><div class="wk-phase" id="wkPhase"></div><div class="wk-sub" id="wkSub"></div></div>
<button class="ibtn" id="next" type="button" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</section>
<ol class="cycle" id="cycle" aria-label="4-week cycle"></ol>

<section class="stats" aria-label="This week">
<div class="stat"><span class="lab">Done</span><span class="val"><span id="doneN">0</span><small id="doneT">/3</small></span><span class="meter"><i id="doneBar"></i></span></div>
<div class="stat"><span class="lab">Per week</span><span class="val" id="wTime">90<small>min</small></span></div>
<div class="stat"><span class="lab">BMI</span><span class="val" id="bmi">0</span></div>
</section>

<main id="days"></main>
<aside class="coach" id="coach"></aside>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
<div class="grab"></div>
<div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">Your settings</h2><button class="ibtn" id="closeSet" type="button" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<form id="setForm" novalidate>
<fieldset><legend>Goal</legend><div class="tiles">
<label class="opt"><input type="radio" name="goal" id="goal-muscle" value="muscle"><span class="tile"><b>Build muscle</b><small>8–12 reps, 90s rest</small></span></label>
<label class="opt"><input type="radio" name="goal" id="goal-fat" value="fat"><span class="tile"><b>Lose fat</b><small>Timed circuits</small></span></label>
<label class="opt"><input type="radio" name="goal" id="goal-skill" value="skill"><span class="tile"><b>Learn skills</b><small>Handstands and levers</small></span></label>
<label class="opt"><input type="radio" name="goal" id="goal-general" value="general"><span class="tile"><b>General fitness</b><small>10–15 reps, 60s rest</small></span></label>
</div></fieldset>
<fieldset><legend>Level</legend><div class="seg">
<label class="opt"><input type="radio" name="level" id="level-0" value="0"><span class="seg-i">Beginner</span></label>
<label class="opt"><input type="radio" name="level" id="level-1" value="1"><span class="seg-i">Intermediate</span></label>
<label class="opt"><input type="radio" name="level" id="level-2" value="2"><span class="seg-i">Advanced</span></label>
</div></fieldset>
<div class="two">
<div><label class="flab" for="w">Weight</label><div class="num"><input id="w" type="number" inputmode="decimal" value="75"><span>kg</span></div></div>
<div><label class="flab" for="h">Height</label><div class="num"><input id="h" type="number" inputmode="decimal" value="178"><span>cm</span></div></div>
</div>
<fieldset><legend>Days per week</legend><div class="seg">
<label class="opt"><input type="radio" name="days" id="days-2" value="2"><span class="seg-i">2</span></label>
<label class="opt"><input type="radio" name="days" id="days-3" value="3"><span class="seg-i">3</span></label>
<label class="opt"><input type="radio" name="days" id="days-4" value="4"><span class="seg-i">4</span></label>
<label class="opt"><input type="radio" name="days" id="days-5" value="5"><span class="seg-i">5</span></label>
</div></fieldset>
<fieldset><legend>Minutes per session</legend><div class="seg">
<label class="opt"><input type="radio" name="mins" id="mins-15" value="15"><span class="seg-i">15</span></label>
<label class="opt"><input type="radio" name="mins" id="mins-30" value="30"><span class="seg-i">30</span></label>
<label class="opt"><input type="radio" name="mins" id="mins-45" value="45"><span class="seg-i">45</span></label>
<label class="opt"><input type="radio" name="mins" id="mins-60" value="60"><span class="seg-i">60</span></label>
</div></fieldset>
<fieldset><legend>Equipment</legend><div class="tiles three">
<label class="opt"><input type="radio" name="eq" id="eq-none" value="none"><span class="tile"><b>None</b><small>Floor and furniture</small></span></label>
<label class="opt"><input type="radio" name="eq" id="eq-bar" value="bar"><span class="tile"><b>Pull-up bar</b><small>Door or park bar</small></span></label>
<label class="opt"><input type="radio" name="eq" id="eq-bardip" value="bardip"><span class="tile"><b>Bar + dips</b><small>Pull-up and dip bars</small></span></label>
</div></fieldset>
<div class="err" id="err" role="alert"></div>
<button class="btn full" id="save" type="submit">Create my plan</button>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
<script>
const EX=`Wall push-ups|push|0|n|pushup||Hands on a wall at chest height, body straight, bring your chest to the wall.
Incline push-ups|push|0|n|pushup||Hands on a sturdy table or bench, body in a straight line, lower chest to the edge.
Knee push-ups|push|0|n|pushup||Knees down, hips in line with shoulders, lower until your chest nearly touches the floor.
Bench dips|push|0|n|dip||Hands on a chair behind you, bend elbows to about 90 degrees, press back up.
Push-ups|push|1|n|pushup||Hands under shoulders, squeeze glutes, lower until your chest is a fist's height from the floor.
Wide push-ups|push|1|n|pushup||Hands wider than shoulders, elbows out at roughly 45 degrees.
Diamond push-ups|push|1|n|pushup||Thumbs and index fingers touching under your chest, elbows tucked close.
Decline push-ups|push|1|n|pushup||Feet on a chair, hands on the floor, keep your core tight so hips don't sag.
Pike push-ups|push|1|n|pike||Hips high in an upside-down V, bend elbows to lower your head between your hands.
Parallel bar dips|push|1|d|dip||Lean slightly forward, lower until shoulders are just below elbows, press up.
Archer push-ups|push|2|n|pushup||Very wide hands, shift your weight onto one arm while the other stays straight.
Pseudo planche push-ups|push|2|n|lean||Hands by your hips with fingers turned out, lean forward and hold that lean as you push.
Elevated pike push-ups|push|2|n|pike||Feet on a chair so hips sit above shoulders, lower your head toward the floor.
Wall handstand push-up negatives|push|2|n|handstand||In a wall handstand, lower slowly over 3-5 seconds, then come down and reset.
Straight bar dips|push|2|b|dip||Hands on top of the bar, lean over it, lower your chest toward the bar and press up.
Table rows|pull|0|n|row||Lie under a sturdy table, grip the edge, pull your chest up keeping your body straight.
Doorframe rows|pull|0|n|row||Grip both sides of a door frame, lean back with straight arms, pull your chest in.
Dead hang|pull|0|b|hang|h|Hang with straight arms and shoulders pulled slightly away from your ears.
Scapular pulls|pull|0|b|hang||From a dead hang, pull your shoulders down without bending your elbows, then relax.
Negative pull-ups|pull|0|b|pullup||Jump or step up to the top position, then lower yourself as slowly as you can.
Feet-elevated table rows|pull|1|n|row||Table rows with your feet on a chair to make them harder.
Towel door rows|pull|1|n|row||Loop a towel around both handles of a closed, locked door, lean back and row. Test it first.
Chin-ups|pull|1|b|pullup||Palms facing you, pull until your chin clears the bar, lower with control.

Bulgarian split squats|legs|1|n|lunge||Back foot on a chair, lower until your front thigh is parallel to the floor.
Walking lunges|legs|1|n|lunge||Step forward into a lunge, then bring the back foot through into the next step.

const LIMBS=[[1,2],[2,3],[1,4],[4,5],[5,6],[4,7],[7,8]];
const full=p=>p.length===14?[...p,...p.slice(10,14)]:p;
function svgFor(p){const A=PAT[p];let s=`<svg class="fig" viewBox="0 -6 100 74" data-p="${p}"><line class="gnd" x1="0" y1="63" x2="100" y2="63"/>`;
if(A.bar)s+=`<line class="bar" x1="${A.bar[0]}" y1="${A.bar[1]}" x2="${A.bar[2]}" y2="${A.bar[3]}"/>`;
s+='<line class="limb"/>'.repeat(7)+'<circle class="head" r="4"/></svg>';return s}
function draw(svg,t){const A=PAT[svg.dataset.p],a=full(A.a),b=full(A.b),j=a.map((v,i)=>v+(b[i]-v)*t);
const ls=svg.querySelectorAll('.limb');LIMBS.forEach(([p,q],i)=>{ls[i].setAttribute('x1',j[p*2]);ls[i].setAttribute('y1',j[p*2+1]);ls[i].setAttribute('x2',j[q*2]);ls[i].setAttribute('y2',j[q*2+1])});
const c=svg.querySelector('.head');c.setAttribute('cx',j[0]);c.setAttribute('cy',j[1])}
const phase=()=>(1-Math.cos(performance.now()/2000*2*Math.PI))/2;
function loop(){const t=phase(),f=document.querySelectorAll('.det.open .fig');for(let i=0;i<f.length;i++)draw(f[i],t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const $=id=>document.getElementById(id),F=['goal','level','w','h','days','mins','eq'];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const M=window.Motion||null,RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const anim=(el,kf,o)=>{if(!M||RM||!el||el.length===0)return null;try{return M.animate(el,kf,o)}catch(e){return null}};
const finished=a=>a?(a.finished||Promise.resolve(a)):Promise.resolve();
const stg=s=>M&&M.stagger?M.stagger(s):0;
const EASE=[.22,1,.36,1];
const D={goal:'muscle',level:'0',w:'75',h:'178',days:'3',mins:'30',eq:'bar'};
const CAT={push:'Push',pull:'Pull',legs:'Legs',core:'Core',skill:'Skill',cond:'Conditioning'};
const GOAL={muscle:'Build muscle',fat:'Lose fat',skill:'Learn skills',general:'General fitness'},LEVEL=['Beginner','Intermediate','Advanced'],EQ={none:'No equipment',bar:'Pull-up bar',bardip:'Bar + dips'};
const PH=['Base week','Base week','Push week','Deload week'],PHS=['Steady sets, clean reps.','Steady sets, clean reps.','One extra set on every exercise.','One set fewer. Let your body recover.'],CY=['Base','Base','Push','Deload'];
let S=null;try{S=JSON.parse(LS.get('cp-s')||'null')}catch(e){S=null}
const cfg=()=>S||D;
const curWeek=()=>S?Math.max(1,Math.floor((Date.now()-S.start)/6048e5)+1):1;
let wk=curWeek();
const getV=k=>{const r=document.querySelector(`input[name="${k}"]:checked`);return r?r.value:$(k).value};
const setV=(k,v)=>{const r=document.querySelector(`input[name="${k}"][value="${v}"]`);if(r)r.checked=true;else if($(k))$(k).value=v};

function plan(c,wk){
const g=c.goal,l=+c.level,d=+c.days,m=+c.mins,eq=c.eq,bmi=c.w/((c.h/100)**2),low=bmi>=30||l===0,ph=(wk-1)%4;
const ok=e=>e.e==='n'||(e.e==='b'&&eq!=='none')||(e.e==='d'&&eq==='bardip');
const pool=k=>{let p=EXS.filter(e=>e.c===k&&ok(e)&&!(low&&e.f==='i')&&e.l<=l&&(k==='cond'||e.l>=l-1));return p.length?p:EXS.filter(e=>e.c===k&&ok(e)&&e.l<=l)};
const each=e=>/lunge|single|split|pistol|shrimp|archer|one-arm|cossack|side plank/i.test(e.n);
const dose=e=>{let s=(g==='muscle'&&l?4:3)+(ph===2?1:ph===3?-1:0);
if(e.f==='h')return e.c==='skill'?`${s+2} x ${['10-15s','15-20s','20-30s'][l]}`:`${s} x ${['20-30s','30-45s','45-60s'][l]}`;
if(g==='fat'&&e.c!=='skill')return '40s on / 20s off';
return `${s} x ${g==='muscle'?'8-12':g==='skill'?'5-8':'10-15'}${each(e)?' each':''}`};
const n=Math.max(3,Math.min(7,Math.round(m/7.5))),T={full:['push','pull','legs','core','push','legs','pull'],upper:['push','pull','push','pull','core','push','pull'],lower:['legs','legs','core','legs','core','legs','core']};
const cnt={},days=[];
for(let i=0;i<d;i++){const type=d<=3?'full':(i%2?'lower':'upper');let slots=T[type].slice(0,n);
if(g==='skill')slots=['skill',...slots.slice(0,n-1)];if(g==='fat'){slots.push('cond');if(m>=45)slots.push('cond')}
const used=new Set,list=slots.map(k=>{const p=pool(k);if(!p.length)return null;const q=cnt[k]||0;let e;for(let t=0;t<p.length;t++){e=p[(wk*3+q+t)%p.length];if(!used.has(e.n))break}cnt[k]=q+1;used.add(e.n);return e}).filter(Boolean);
days.push({i,label:{full:i%2?'Full body B':'Full body A',upper:'Upper body',lower:'Lower body and core'}[type],list:list.map(e=>({e,dose:dose(e)}))})}
const notes=[g==='fat'?`Circuit: go through the list with little rest, ${ph===3?2:ph===2?4:3} rounds.`:g==='muscle'?'Rest 90s between sets and stop 1–2 reps before failure.':g==='skill'?'Do skill work first while fresh, rest 2 minutes between sets.':'Rest 60s between sets.','Warm up for 5 minutes first.','When an exercise feels easy at the top of its range, move up a level in settings.'];
if(low)notes.push('Low-impact moves are used to go easy on your joints.');
return{d,m,bmi,ph,days,notes}}

const fmtDose=s=>s.replace(/^(\d+) x /,'<b>$1</b><i>×</i>').replace(/(\d)-(\d)/g,'$1–$2').replace(' / ',' · ');

function render(dir){
const c=cfg(),P=plan(c,wk);

$('sample').hidden=!!S;
$('wkNum').textContent=wk;$('wkPhase').textContent=PH[P.ph];$('wkSub').textContent=PHS[P.ph];$('prev').disabled=wk<=1;

$('wTime').innerHTML=`${P.d*P.m}<small>min</small>`;$('bmi').textContent=P.bmi.toFixed(1);

day.list.forEach(({e,dose})=>{const meta=[CAT[e.c],e.e==='b'?'Bar':e.e==='d'?'Dip bars':'',e.f==='h'?'Hold':''].filter(Boolean).join(' · ');

h+='</ul></article>'});

function updateDone(animate){const all=document.querySelectorAll('.check'),n=document.querySelectorAll('.check[aria-pressed="true"]').length,p=all.length?n/all.length:0,bar=$('doneBar');

async function toggleEx(btn){const det=btn.nextElementSibling,open=btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',String(open));

['openSet','summary','setupBtn'].forEach(id=>$(id).onclick=openSheet);

['w','h'].forEach(k=>$(k).addEventListener('input',()=>{$('err').textContent=''}));
$('setForm').addEventListener('submit',e=>{e.preventDefault();const w=+getV('w'),h=+getV('h');

const n={start:S?S.start:Date.now()};F.forEach(k=>n[k]=getV(k));S=n;LS.set('cp-s',JSON.stringify(S));wk=curWeek();closeSheet();render(0)});

render(0);
